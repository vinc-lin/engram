[package]
name = "engram-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "engram_mcp"
path = "src/lib.rs"

[[bin]]
name = "engram-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
tiny_http = "0.12"
