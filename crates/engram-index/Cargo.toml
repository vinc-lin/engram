[package]
name = "engram-index"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "engram-index"
path = "src/main.rs"

[lib]
name = "engram_index"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
